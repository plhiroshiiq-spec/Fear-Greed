name: fg

# SPEC.md 4章。cron はUTC。遅延10〜30分を許容する。
on:
  schedule:
    # morning: 火〜土 06:40 JST = 月〜金 21:40 UTC(米国引け後の確定値)
    - cron: "40 21 * * 1-5"
    # intraday: 火〜土 00:30 JST = 月〜金 15:30 UTC(米国市場時間中に1回)
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fg-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build data/fg.json
        run: python -m fg.build_json -v

      # EXT(SPEC.md 9.2章)は見送り中。使えるソースが無いため毎日空振りさせない。
      # 復活させるときはこの下に `python -m fg.ext -v` を戻す(docs/ext_source.md)。

      # 丸め規則の照合用の観測(SPEC.md 3章 P1)。確定したら削除してよい。
      - name: Record rounding observation
        run: python -m fg.rounding_probe --observe

      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: update fg.json ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $(( 2 ** attempt ))
          done
          exit 1
